<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ホワサバ 集結・差し込み共有タイマー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>❄️ ホワサバ 集結・差し込み共有タイマー</h1>
    <p id="headerSubtitle" class="subtitle">URLを共有すると、入力した集結・行軍タイマーが全員にリアルタイム同期されます</p>
  </header>

  <main class="container">
    <!-- 部屋（共有URL）コントロール -->
    <section class="share-box">
      <div class="share-info">
        <span id="syncStatus" class="sync-badge">🔄 接続中...</span>
        <span class="room-label">部屋ID: <strong id="roomIdDisplay">---</strong></span>
        <span id="modeBadge" class="mode-badge">編集モード</span>
      </div>
      <div class="share-actions" id="editShareActions">
        <button id="copyViewUrlBtn" class="btn btn-success btn-sm">👀 見るだけURLをコピー</button>
        <button id="copyEditUrlBtn" class="btn btn-primary btn-sm">✏️ 編集URLをコピー</button>
        <button id="newRoomBtn" class="btn btn-ghost btn-sm">＋ 新しい部屋を作る</button>
      </div>
    </section>

    <!-- 自分の行軍時間（複数登録対応・端末ごとに個別保存） -->
    <section class="my-march-box">
      <div class="my-march-top">
        <div class="my-march-header">
          <span class="badge">あなた専用（他の人には見えません）</span>
          <h2>自分の行軍時間（複数登録可）</h2>
        </div>
        <button id="addMyMarchBtn" class="btn btn-primary btn-sm">＋ 行軍を追加</button>
      </div>
      <div id="myMarchList" class="my-march-list"></div>
      <p class="hint">※登録した行軍ごとに、各都市カードへ「発射までの残り時間」を別々に表示します。</p>
    </section>

    <!-- コントロールバー（編集モードのみ表示） -->
    <div class="toolbar" id="editToolbar">
      <button id="addCityBtn" class="btn btn-primary">＋ 都市を追加</button>
      <button id="startAllBtn" class="btn btn-success">▶ すべて開始</button>
      <button id="resetAllBtn" class="btn btn-secondary">↺ すべてリセット</button>
      <span class="toolbar-hint">※カードの ☰ をドラッグして並び替え</span>
    </div>

    <!-- 都市カード一覧 -->
    <div id="cityList" class="city-grid"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
